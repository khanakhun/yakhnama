# District boundary source for Gilgit-Baltistan (ADR 0021).
# Validated by DistrictBoundarySource
# (src/yakhnama/modules/geography/domain/boundaries.py) in tests/unit/data/.
# Read by `poetry run poe load-boundaries` (YAKHNAMA_BOUNDARY_SOURCE_FILE), never by
# `poe seed`; it is not a seeded reference file, so it lives outside data/reference.
#
# The archive is pinned by URL and SHA-256: the loader downloads it once into
# YAKHNAMA_BOUNDARY_CACHE_DIR and refuses any file with another digest. A new COD-AB
# release means a new download_url, sha256, dataset_version and data_version here,
# reviewed like any other change, and a new look at the links below.
#
# Licence as stated on the HDX dataset page (checked 2026-10-05): "Creative Commons
# Attribution for Intergovernmental Organisations (CC BY-IGO)", licence_url
# http://creativecommons.org/licenses/by/3.0/igo/legalcode (served here over https).
#
# links: one row per Gilgit-Baltistan district (adm1_pcode PK3) in the archive's
# pak_admin2.geojson. place_code is set only where the gazetteer
# (admin_hierarchy_gb.yaml) has the same district; it is never guessed. COD-AB has
# 14 districts in Gilgit-Baltistan; the gazetteer has 10 fixtures. The four without
# a gazetteer place stay unlinked until the maintainer adds them (open question
# Q230). Linking a gazetteer fixture to a COD-AB polygon makes that polygon the
# fixture's footprint, even where the dataset splits off a district the fixture may
# have been meant to include (open question Q231).
