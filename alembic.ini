# Alembic configuration for Yakhnama (ADR 0004, write-migration skill).
#
# No database URL lives here: migrations/env.py reads it from
# yakhnama.platform.settings.Settings (the YAKHNAMA_DATABASE_URL environment variable
# or .env), and `alembic -x database_url=postgresql+asyncpg://...` overrides it for one
# run. Keeping the URL out of this file keeps credentials out of the repository.
#
# No post-write hook runs Ruff on generated revisions: pyproject.toml excludes
# migrations/versions from Ruff, and every revision is hand-reviewed and formatted by
# its author as part of the write-migration checklist.

[alembic]
# %(here)s makes the path independent of the working directory, so tests that load
# this file by absolute path work from anywhere.
script_location = %(here)s/migrations

# NNNN_<slug>.py: the revision id is the four-digit number passed as --rev-id.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# The "Create Date" in generated files is UTC, like every timestamp in the project.
timezone = UTC

# src/ holds the yakhnama package; env.py imports Base and the ORM modules from it.
prepend_sys_path = src

path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# WARNING, not INFO: INFO would echo every statement during a migration run.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
