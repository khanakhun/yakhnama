[project]
name = "yakhnama"
version = "0.1.0"
description = "Chronicle of the ice: the open system of record for natural hazards and disasters in high-mountain regions, starting with Gilgit-Baltistan."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "kashanghori", email = "kashanghoriii@gmail.com" }]
requires-python = ">=3.13,<4.0"
keywords = ["disaster-risk", "glof", "gilgit-baltistan", "hazards", "open-data", "fastapi", "postgis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = ["fastapi (>=0.141.1,<0.142.0)", "uvicorn[standard] (>=0.53.0,<0.54.0)", "pydantic (>=2.13.5,<3.0.0)", "pydantic-settings (>=2.15.0,<3.0.0)", "geojson-pydantic (>=2.2.0,<3.0.0)", "sqlalchemy[asyncio] (>=2.0.54,<3.0.0)", "asyncpg (>=0.31.0,<0.32.0)", "geoalchemy2 (>=0.20.0,<0.21.0)", "alembic (>=1.20.0,<2.0.0)", "shapely (>=2.1.2,<3.0.0)", "structlog (>=26.1.0,<27.0.0)", "httpx (>=0.28.1,<0.29.0)", "opentelemetry-api (>=1.44.0,<2.0.0)", "opentelemetry-sdk (>=1.44.0,<2.0.0)", "opentelemetry-instrumentation-fastapi (>=0.65b0,<0.66)", "prometheus-client (>=0.26.0,<0.27.0)", "pyyaml (>=6.0.3,<7.0.0)", "opentelemetry-instrumentation-sqlalchemy (>=0.65b0,<0.66)", "pyjwt[crypto] (>=2.14.0,<3.0.0)", "redis (>=8.1.0,<9.0.0)", "scalar-fastapi (>=1.9.0,<2.0.0)", "aiobotocore (>=3.9.1,<4.0.0)", "pillow (>=12.3.0,<13.0.0)", "filetype (>=1.2.0,<2.0.0)", "taskiq (>=0.12.6,<0.13.0)", "taskiq-redis (>=1.2.3,<2.0.0)"]

[project.urls]
Homepage = "https://github.com/khanakhun/yakhnama"
Repository = "https://github.com/khanakhun/yakhnama"
Issues = "https://github.com/khanakhun/yakhnama/issues"
Changelog = "https://github.com/khanakhun/yakhnama/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "yakhnama", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.8"
mypy = "^2.3.1"
import-linter = "^2.15"
poethepoet = "^0.48.0"
pre-commit = "^4.6.2"
commitizen = "^4.19.0"
pip-audit = "^2.10.1"
types-pyyaml = "^6.0.12.20260906"
types-shapely = "^2.1.0.20260728"
types-aiobotocore = {extras = ["s3"], version = "^3.9.1"}

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
diff-cover = "^10.6.0"
hypothesis = "^6.168.0"
polyfactory = "^3.3.0"
testcontainers = {extras = ["redis"], version = "^4.15.0"}

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.7"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff                                                                        #
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "A", "C4", "C90", "SIM", "RET",
          "PTH", "TID", "TC", "PL", "RUF", "S", "ANN", "ERA", "T20", "DTZ", "PT",
          "ASYNC", "FBT", "BLE", "EM", "G", "ISC", "PIE", "PERF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Test-only relaxations: S101 because pytest uses assert; PLR2004 because expected
# literals are the point of a test; D103 because the test name is the documentation;
# ANN201 because every test returns None.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D103", "ANN201"]

# --------------------------------------------------------------------------- #
# mypy                                                                        #
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = false
files = ["src", "tests", ".claude/hooks", "migrations"]
mypy_path = ["src", ".claude/hooks"]
explicit_package_bases = true
namespace_packages = true
pretty = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# import-linter: layer and module boundaries (§4.2)                           #
# --------------------------------------------------------------------------- #

[tool.importlinter]
root_package = "yakhnama"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared_kernel is framework-free and depends on nothing inside yakhnama"
type = "forbidden"
source_modules = ["yakhnama.shared_kernel"]
forbidden_modules = [
  "yakhnama.platform",
  "yakhnama.modules",
  "yakhnama.main",
  "fastapi",
  "starlette",
  "sqlalchemy",
  "geoalchemy2",
  "alembic",
  "asyncpg",
  "httpx",
  "shapely",
  "boto3",
  "botocore",
  "structlog",
]

[[tool.importlinter.contracts]]
name = "platform never imports the application entry point"
type = "forbidden"
source_modules = ["yakhnama.platform"]
forbidden_modules = ["yakhnama.main"]
# The OpenAPI snapshot writer is a command-line entry point like main itself: it
# must build the real app to render its document, and nothing imports it.
ignore_imports = ["yakhnama.platform.openapi_snapshot -> yakhnama.main"]

[[tool.importlinter.contracts]]
name = "modules are independent except through each other's public facade"
type = "independence"
modules = [
  "yakhnama.modules.geography",
  "yakhnama.modules.hazards",
  "yakhnama.modules.impacts",
  "yakhnama.modules.identity",
  "yakhnama.modules.provenance",
  "yakhnama.modules.audit",
  "yakhnama.modules.reports",
  "yakhnama.modules.media",
  "yakhnama.modules.events",
  "yakhnama.modules.verification",
]
ignore_imports = [
  "yakhnama.modules.** -> yakhnama.modules.geography.public",
  "yakhnama.modules.** -> yakhnama.modules.hazards.public",
  "yakhnama.modules.** -> yakhnama.modules.impacts.public",
  "yakhnama.modules.** -> yakhnama.modules.identity.public",
  "yakhnama.modules.** -> yakhnama.modules.provenance.public",
  "yakhnama.modules.** -> yakhnama.modules.audit.public",
  "yakhnama.modules.** -> yakhnama.modules.reports.public",
  "yakhnama.modules.** -> yakhnama.modules.media.public",
  "yakhnama.modules.** -> yakhnama.modules.events.public",
  "yakhnama.modules.** -> yakhnama.modules.verification.public",
]
# The facades are empty until modules have content, so unmatched ignores are expected.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "hexagonal layers inside every module (api and infrastructure never import each other)"
type = "layers"
containers = [
  "yakhnama.modules.geography",
  "yakhnama.modules.hazards",
  "yakhnama.modules.impacts",
  "yakhnama.modules.identity",
  "yakhnama.modules.provenance",
  "yakhnama.modules.audit",
  "yakhnama.modules.reports",
  "yakhnama.modules.media",
  "yakhnama.modules.events",
  "yakhnama.modules.verification",
]
layers = [
  "api | infrastructure",
  "application",
  "domain",
]

[[tool.importlinter.contracts]]
name = "domain layers are framework-free and never import platform"
type = "forbidden"
source_modules = [
  "yakhnama.modules.geography.domain",
  "yakhnama.modules.hazards.domain",
  "yakhnama.modules.impacts.domain",
  "yakhnama.modules.identity.domain",
  "yakhnama.modules.provenance.domain",
  "yakhnama.modules.audit.domain",
  "yakhnama.modules.reports.domain",
  "yakhnama.modules.media.domain",
  "yakhnama.modules.events.domain",
  "yakhnama.modules.verification.domain",
]
forbidden_modules = [
  "yakhnama.platform",
  "fastapi",
  "starlette",
  "sqlalchemy",
  "geoalchemy2",
  "alembic",
  "asyncpg",
  "httpx",
  "shapely",
  "boto3",
  "botocore",
  "structlog",
]

[[tool.importlinter.contracts]]
name = "application layers never import platform or frameworks"
type = "forbidden"
source_modules = [
  "yakhnama.modules.geography.application",
  "yakhnama.modules.hazards.application",
  "yakhnama.modules.impacts.application",
  "yakhnama.modules.identity.application",
  "yakhnama.modules.provenance.application",
  "yakhnama.modules.audit.application",
  "yakhnama.modules.reports.application",
  "yakhnama.modules.media.application",
  "yakhnama.modules.events.application",
  "yakhnama.modules.verification.application",
]
forbidden_modules = [
  "yakhnama.platform",
  "fastapi",
  "starlette",
  "sqlalchemy",
  "geoalchemy2",
  "alembic",
  "asyncpg",
  "httpx",
  "shapely",
  "boto3",
  "botocore",
]

[[tool.importlinter.contracts]]
name = "api layers never import persistence or storage libraries"
type = "forbidden"
source_modules = [
  "yakhnama.modules.geography.api",
  "yakhnama.modules.hazards.api",
  "yakhnama.modules.impacts.api",
  "yakhnama.modules.identity.api",
  "yakhnama.modules.provenance.api",
  "yakhnama.modules.audit.api",
  "yakhnama.modules.reports.api",
  "yakhnama.modules.media.api",
  "yakhnama.modules.events.api",
  "yakhnama.modules.verification.api",
]
forbidden_modules = ["sqlalchemy", "geoalchemy2", "alembic", "asyncpg", "boto3", "botocore", "shapely"]

[[tool.importlinter.contracts]]
name = "seed orchestrates modules only through their public facades and the kernel"
type = "forbidden"
source_modules = ["yakhnama.seed"]
forbidden_modules = [
  "yakhnama.modules.geography.domain",
  "yakhnama.modules.geography.application",
  "yakhnama.modules.geography.infrastructure",
  "yakhnama.modules.hazards.domain",
  "yakhnama.modules.hazards.application",
  "yakhnama.modules.hazards.infrastructure",
  "yakhnama.modules.impacts.domain",
  "yakhnama.modules.impacts.application",
  "yakhnama.modules.impacts.infrastructure",
  "yakhnama.modules.identity.domain",
  "yakhnama.modules.identity.application",
  "yakhnama.modules.identity.infrastructure",
  "yakhnama.modules.provenance.domain",
  "yakhnama.modules.provenance.application",
  "yakhnama.modules.provenance.infrastructure",
  "yakhnama.modules.audit.domain",
  "yakhnama.modules.audit.application",
  "yakhnama.modules.audit.infrastructure",
  "yakhnama.modules.reports.domain",
  "yakhnama.modules.reports.application",
  "yakhnama.modules.reports.infrastructure",
  "yakhnama.modules.media.domain",
  "yakhnama.modules.media.application",
  "yakhnama.modules.media.infrastructure",
  "yakhnama.modules.events.domain",
  "yakhnama.modules.events.application",
  "yakhnama.modules.events.infrastructure",
  "yakhnama.modules.verification.domain",
  "yakhnama.modules.verification.application",
  "yakhnama.modules.verification.infrastructure",
]
# Facades re-export domain and application types, so only direct imports count.
allow_indirect_imports = true

# --------------------------------------------------------------------------- #
# pytest and coverage (§11)                                                   #
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", ".claude/hooks"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: touches real tools or services (git, ruff, mypy; PostGIS/MinIO via testcontainers from Phase 1)",
]

[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio bridge runs on greenlets; without this the adapter
# branches executed under await are not recorded.
concurrency = ["thread", "greenlet"]
source = ["yakhnama", ".claude/hooks"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "\\.\\.\\.$",
]

[tool.coverage.xml]
output = "coverage.xml"

# --------------------------------------------------------------------------- #
# commitizen: Conventional Commits and changelog                              #
# --------------------------------------------------------------------------- #

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_incremental = true

# --------------------------------------------------------------------------- #
# Poe tasks: the same commands locally and in CI (§13.5)                      #
# --------------------------------------------------------------------------- #

[tool.poe]
poetry_command = ""

[tool.poe.tasks.format]
help = "Format code and apply safe lint fixes"
sequence = [
  { cmd = "ruff format ." },
  { cmd = "ruff check --fix ." },
]

[tool.poe.tasks.lint]
help = "Verify formatting and lint rules (no changes)"
sequence = [
  { cmd = "ruff format --check ." },
  { cmd = "ruff check ." },
]

[tool.poe.tasks.typecheck]
help = "mypy --strict over src, tests and hooks"
cmd = "mypy"

[tool.poe.tasks.arch]
help = "Enforce layer and module import contracts"
cmd = "lint-imports"

[tool.poe.tasks.test-unit]
help = "Unit tests (no I/O) with coverage"
cmd = "pytest tests/unit --cov --cov-report=term-missing --cov-report=xml"

[tool.poe.tasks.test-integration]
help = "Tests that touch real tools or services (git, ruff, mypy now; PostGIS and MinIO from Phase 1)"
cmd = "pytest tests/integration -m integration"

[tool.poe.tasks.test-api]
help = "HTTP-level tests against the app factory"
cmd = "pytest tests/api tests/architecture"

[tool.poe.tasks.cov]
help = "Every test tier with the coverage gate (integration needs Docker for PostGIS)"
cmd = "pytest tests/unit tests/api tests/architecture tests/integration --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.poe.tasks.cov-layers]
help = "Per-layer gate: >= 95% branch coverage in every module's domain and application layer"
sequence = [
  { cmd = "coverage report --include='*/yakhnama/modules/*/domain/*' --fail-under=95" },
  { cmd = "coverage report --include='*/yakhnama/modules/*/application/*' --fail-under=95" },
]

[tool.poe.tasks.migrate]
help = "Apply all Alembic migrations to the configured database"
cmd = "alembic upgrade head"

[tool.poe.tasks.seed]
help = "Load the versioned reference data idempotently"
cmd = "python -m yakhnama.seed"

[tool.poe.tasks.worker]
help = "Run a Taskiq worker for background tasks (needs YAKHNAMA_TASK_QUEUE_BACKEND=redis)"
cmd = "taskiq worker yakhnama.platform.tasks.worker:broker"

[tool.poe.tasks.scheduler]
help = "Run the Taskiq scheduler for periodic tasks; run exactly one per deployment"
cmd = "taskiq scheduler yakhnama.platform.tasks.worker:scheduler"

[tool.poe.tasks.diff-cover]
help = "Require >= 90% coverage on lines changed relative to main"
cmd = "diff-cover coverage.xml --compare-branch=main --fail-under=90"

[tool.poe.tasks.security]
help = "Secret scan and dependency audit"
sequence = [
  { cmd = "gitleaks git --no-banner --redact ." },
  { shell = "set -o pipefail; poetry export --without-hashes --all-groups -f requirements.txt | pip-audit --strict --progress-spinner off -r /dev/stdin", interpreter = "bash" },
]

[tool.poe.tasks.openapi-snapshot]
help = "Regenerate tests/contract/openapi.json from the app factory"
cmd = "python -m yakhnama.platform.openapi_snapshot"

[tool.poe.tasks.contract]
help = "Verify the committed OpenAPI snapshot matches the app"
cmd = "pytest tests/contract"

[tool.poe.tasks.up]
help = "Start PostGIS, MinIO, Keycloak and Redis, then create the MinIO buckets"
sequence = [
  { cmd = "docker compose up -d --wait --wait-timeout 240" },
  { cmd = "docker compose run --rm minio-init" },
]

[tool.poe.tasks.down]
help = "Stop the local services"
cmd = "docker compose down"

[tool.poe.tasks.docs]
help = "Serve the documentation site locally"
cmd = "mkdocs serve"

[tool.poe.tasks.check]
help = "Everything CI runs, in order. Green here means green in CI."
sequence = ["lint", "typecheck", "arch", "cov", "cov-layers", "contract", "diff-cover", "security"]
