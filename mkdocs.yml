site_name: Yakhnama
site_description: >-
  Chronicle of the ice — the open system of record for natural hazards and disasters in
  high-mountain regions, starting with Gilgit-Baltistan.
site_url: https://khanakhun.github.io/yakhnama/
repo_url: https://github.com/khanakhun/yakhnama
repo_name: khanakhun/yakhnama
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture: architecture/README.md
  - API conventions: architecture/api.md
  - Authentication: architecture/auth.md
  - Recording flow: architecture/recording.md
  - Media storage: architecture/media.md
  - Best figure policy: architecture/best-figure.md
  - ADRs:
      - Overview: adr/README.md
      - "0001 · Modular monolith with hexagonal layers": adr/0001-modular-monolith-with-hexagonal-layers.md
      - "0002 · PostgreSQL with PostGIS": adr/0002-postgresql-with-postgis.md
      - "0003 · FastAPI with app factory": adr/0003-fastapi-with-app-factory.md
      - "0004 · Async SQLAlchemy and Alembic": adr/0004-async-sqlalchemy-and-alembic.md
      - "0005 · OIDC-only authentication": adr/0005-oidc-only-authentication.md
      - "0006 · UUIDv7 identifiers": adr/0006-uuidv7-identifiers.md
      - "0007 · Transactional outbox for domain events": adr/0007-transactional-outbox-for-domain-events.md
      - "0008 · Taskiq behind a task-queue port": adr/0008-taskiq-behind-a-task-queue-port.md
      - "0009 · Object storage for media and rasters": adr/0009-object-storage-for-media-and-rasters.md
      - "0010 · Licensing": adr/0010-licensing.md
      - "0011 · Catalog entries for settings and API schemas": adr/0011-catalog-entries-for-settings-and-api-schemas.md
      - "0012 · Catalog entries for commands, queries, DTOs and errors": adr/0012-catalog-entries-for-commands-queries-dtos-and-errors.md
      - "0013 · In-house UUIDv7 generator": adr/0013-in-house-uuidv7-generator.md
  - Data dictionary:
      - Overview: data-dictionary/README.md
      - Geography: data-dictionary/geography.md
      - Hazards: data-dictionary/hazards.md
      - Impacts: data-dictionary/impacts.md
      - Identity: data-dictionary/identity.md
      - Provenance: data-dictionary/provenance.md
      - Audit: data-dictionary/audit.md
      - Reports: data-dictionary/reports.md
      - Media: data-dictionary/media.md
      - Events: data-dictionary/events.md
      - Verification: data-dictionary/verification.md
  - Open questions: open-questions.md
  - Plans:
      - "Phase 0 · Foundation": plans/phase-0.md
      - "Phase 1 · Shared kernel and reference data": plans/phase-1.md
      - Phase 1 report: plans/phase-1-report.md
      - Phase 2: plans/phase-2.md
      - Phase 2 report: plans/phase-2-report.md
      - Phase 3: plans/phase-3.md
